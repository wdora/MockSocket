name: 构建并推送 MockSocket.Server Docker 镜像

on:
  push:
    branches: ["**"]
    tags: ["v**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: mocksocket-server
  USERNAME: wdora

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/MockSocket.Server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 更新 K8s Deployment 镜像标签
        if: github.event_name != 'pull_request'
        run: |
          # 获取构建的镜像标签
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "更新镜像标签到: $IMAGE_TAG"

          # 更新 k8s/deploy.yaml
          sed -i "s|image: wdora/mocksocket-server:.*|image: $IMAGE_TAG|g" k8s/deploy.yaml

          # 更新 k8s-mocksocket-server.yml
          sed -i "s|image: wdora/mocksocket-server:.*|image: $IMAGE_TAG|g" k8s-mocksocket-server.yml

          # 显示更新后的内容
          echo "k8s/deploy.yaml 更新后的镜像配置:"
          grep "image:" k8s/deploy.yaml

          echo "k8s-mocksocket-server.yml 更新后的镜像配置:"
          grep "image:" k8s-mocksocket-server.yml
          git pull

      - name: 提交 K8s 配置更新
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "🤖 自动更新 K8s deployment 镜像标签到: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          file_pattern: k8s/deploy.yaml k8s-mocksocket-server.yml
