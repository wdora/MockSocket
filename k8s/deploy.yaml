apiVersion: apps/v1
kind: Deployment
metadata:
  name: mocksocket
  labels:
    app: mocksocket
spec:
  selector:
    matchLabels:
      app: mocksocket
  replicas: 1
  strategy:
    # rollingUpdate:
    #   maxSurge: 25%
    #   maxUnavailable: 25%
    type: Recreate
  template:
    metadata:
      labels:
        app: mocksocket
    spec:
      # initContainers:
      # Init containers are exactly like regular containers, except:
      # - Init containers always run to completion.
      # - Each init container must complete successfully before the next one starts.
      hostNetwork: true
      securityContext:
        runAsUser: 0
      containers:
        - name: mocksocket
          image: docker.io/wdora/mocksocket-server:20250912-072620
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
            limits:
              cpu: 2000m
              memory: 500Mi
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
          ports:
            - containerPort: 9090
              protocol: TCP
          env:
            - name: TZ
              value: Asia/Shanghai
      volumes:
        - name: localtime
          hostPath:
            path: /usr/share/zoneinfo/Asia/Shanghai
      restartPolicy: Always
